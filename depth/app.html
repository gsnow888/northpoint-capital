<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>if(location.hostname==='studioamr.github.io')location.replace('https://northpointcapital.io/depth/'+location.pathname.replace(/^\/northpoint-depth\/?/,'')+location.search+location.hash)</script>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NORTHPOINT DEPTH</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ NORTHPOINT DEPTH · sistema de diseño ============ */
:root{
  --bg:#02050b;--bg2:#050b17;--surf:rgba(13,22,40,.66);--surf2:rgba(20,32,56,.55);--hov:rgba(120,160,255,.07);
  --line:rgba(148,180,255,.09);--line2:rgba(148,180,255,.16);--hi:inset 0 1px 0 rgba(255,255,255,.045);
  --tx:#eaf2ff;--tx2:#b9c7dd;--mut:#7d8fab;--mut2:#56677f;
  --ac:#5ab0ff;--ac2:#3d5afe;--grad:linear-gradient(135deg,#3d5afe 0%,#5ab0ff 100%);--glow:0 0 0 1px rgba(90,176,255,.35),0 8px 28px rgba(61,90,254,.28);
  --up:#22d3ee;--dn:#3d5afe;--warn:#ffd166;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--sans:Inter,-apple-system,"Helvetica Neue",sans-serif;--disp:Outfit,Inter,sans-serif;
  --r:12px;--r2:9px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;color:var(--tx);font:13px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body{display:flex;flex-direction:column;background:
  radial-gradient(1100px 600px at 12% -12%,rgba(61,90,254,.13),transparent 60%),
  radial-gradient(900px 520px at 100% 110%,rgba(34,211,238,.07),transparent 60%),var(--bg)}
::selection{background:rgba(90,176,255,.35)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(148,180,255,.14);border-radius:99px}::-webkit-scrollbar-track{background:transparent}

/* ---- controles ---- */
select,button,input[type=number],input[type=text],input[type=password],input[type=date],input[type=time],textarea{
  font:500 12px var(--sans);color:var(--tx);background:var(--surf2);border:1px solid var(--line);border-radius:var(--r2);height:30px;padding:0 10px;outline:0;
  transition:border-color .15s,background .15s,box-shadow .15s;box-shadow:var(--hi)}
textarea{height:auto;padding:8px 10px;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--mut2)}
input:focus,select:focus,textarea:focus{border-color:rgba(90,176,255,.55);box-shadow:0 0 0 3px rgba(90,176,255,.14)}
select{appearance:none;-webkit-appearance:none;padding-right:26px;cursor:pointer;
  background:var(--surf2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%237d8fab' stroke-width='1.5' stroke-linecap='round'/></svg>") no-repeat right 10px center}
option,optgroup{background:#0a1426;color:var(--tx)}
button{cursor:pointer;white-space:nowrap}
button:hover,select:hover{border-color:var(--line2);background-color:rgba(28,44,76,.6)}
button:active{transform:translateY(1px)}
.pri,button.pri{background:var(--grad);border-color:transparent;color:#fff;font-weight:600;box-shadow:var(--glow)}
.pri:hover{filter:brightness(1.08)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:34px;height:20px;border-radius:99px;background:rgba(148,180,255,.14);position:relative;cursor:pointer;transition:background .2s;margin:0;border:0;box-shadow:inset 0 0 0 1px var(--line)}
input[type=checkbox]::before{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#cfdcf2;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.3,.7,.4,1.2)}
input[type=checkbox]:checked{background:var(--grad);box-shadow:0 0 12px rgba(61,90,254,.4)}
input[type=checkbox]:checked::before{transform:translateX(14px);background:#fff}
input[type=range]{width:74px;accent-color:#5ab0ff}
.sp{flex:1}
.u{color:var(--up)}.d{color:var(--dn)}

/* ---- barra superior ---- */
.top{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(8,15,30,.92),rgba(5,10,22,.82));backdrop-filter:blur(18px);position:relative;z-index:6}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(90,176,255,.35),transparent)}
.logo{font:700 13px var(--disp);letter-spacing:.16em;margin-right:10px;white-space:nowrap;color:var(--tx);text-decoration:none;display:flex;align-items:center}
.logo b{font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:flex;background:rgba(10,18,34,.7);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;box-shadow:var(--hi)}
.seg button{border:0;background:none;border-radius:8px;height:24px;padding:0 11px;color:var(--mut);box-shadow:none;font-weight:500}
.seg button:hover{color:var(--tx);background:var(--hov)}
.seg button.on{background:rgba(90,176,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(90,176,255,.35)}
.seg svg{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:1.6}
.ctl{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:11.5px;padding:0 4px}
#dlMac,#dlWin{display:inline-flex;align-items:center;height:30px}

/* ---- franja de datos ---- */
.info{display:flex;gap:0;align-items:stretch;padding:0 4px;border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--mut);white-space:nowrap;overflow:hidden;min-height:44px;background:rgba(4,9,19,.55)}
.info div{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 16px;border-right:1px solid var(--line)}
.info div:last-child{border-right:0}
.info small{font:600 9px var(--sans);letter-spacing:.14em;color:var(--mut2)}
.info b{color:var(--tx);font-weight:500;font-size:12.5px}
.info .big{padding-left:12px}.info .big b{font:600 18px var(--mono);letter-spacing:-.02em}
.info .big small{color:var(--tx2)}

/* ---- estructura ---- */
.main{flex:1;display:flex;min-height:0}
.tools{width:46px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0;background:rgba(4,9,19,.5)}
.tools button{width:32px;height:32px;padding:0;display:grid;place-items:center;border-color:transparent;background:none;border-radius:9px;box-shadow:none}
.tools button:hover{background:var(--hov)}
.tools button.on{background:rgba(90,176,255,.15);box-shadow:inset 0 0 0 1px rgba(90,176,255,.4),0 0 14px rgba(61,90,254,.25)}
.tools svg{width:16px;height:16px;stroke:var(--tx2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tools button.on svg{stroke:#fff}
.tools hr{width:22px;border:0;border-top:1px solid var(--line);margin:5px 0}
.left{flex:1;min-width:0;display:flex;flex-direction:column}
.read{font:11px var(--mono);color:var(--mut);padding:0 14px;height:28px;line-height:28px;white-space:nowrap;overflow:hidden;border-bottom:1px solid rgba(148,180,255,.05)}
.read b{color:var(--tx);font-weight:500}.read .u{color:var(--up)}.read .d{color:var(--dn)}
.cv{flex:1;position:relative;min-height:0;background:radial-gradient(1200px 700px at 50% 40%,rgba(20,40,80,.12),transparent 70%)}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}

/* ---- panel derecho ---- */
.right{width:328px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,rgba(7,13,26,.85),rgba(4,9,19,.85))}
.rt{display:flex;gap:2px;margin:10px 10px 6px;padding:3px;background:rgba(10,18,34,.8);border:1px solid var(--line);border-radius:11px;box-shadow:var(--hi)}
.rt button{flex:1;height:28px;border:0;border-radius:8px;background:none;color:var(--mut);padding:0;font:600 10.5px var(--sans);letter-spacing:.06em;box-shadow:none}
.rt button:hover{color:var(--tx)}
.rt button.on{color:#fff;background:linear-gradient(135deg,rgba(61,90,254,.55),rgba(90,176,255,.35));box-shadow:0 2px 12px rgba(61,90,254,.3),inset 0 0 0 1px rgba(255,255,255,.08)}
.pn{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto}.pn[hidden]{display:none}
.h{font:600 10px var(--sans);letter-spacing:.14em;color:var(--mut2);padding:12px 14px 7px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase}
.h select{height:24px;font-size:11px;padding:0 22px 0 8px}
#domW{flex:1;position:relative;min-height:170px}#domW canvas{position:absolute;inset:0;width:100%;height:100%}
#spd{display:block;width:100%;height:46px}
#tape{min-height:150px;overflow:hidden;font:11px var(--mono)}
#tape .r{display:grid;grid-template-columns:62px 1fr 54px 26px 58px;gap:4px;padding:3px 14px}
#tape .r span:nth-child(n+3){text-align:right}
#tape .r.th{color:var(--mut);font:600 9.5px var(--sans,Inter);letter-spacing:.08em;text-transform:uppercase;background:none!important;padding-bottom:5px}
#tape .r.big{font-weight:700;background:rgba(255,255,255,.07)!important;color:#fff}
#tape .r.u span:nth-child(4){color:var(--up)}#tape .r.d span:nth-child(4){color:var(--dn)}
#tape .r:nth-child(odd){background:rgba(148,180,255,.025)}
.list{flex:1;overflow:auto;font:12px var(--mono)}
.list h6{margin:0;padding:12px 14px 5px;font:600 10px var(--sans);letter-spacing:.14em;color:var(--mut2);position:sticky;top:0;background:#060c19;text-transform:uppercase;z-index:1}
.wr{display:grid;grid-template-columns:1fr auto 66px;gap:10px;padding:7px 14px;cursor:pointer;align-items:center;border-bottom:1px solid rgba(148,180,255,.04)}
.wr:hover{background:var(--hov)}.wr.on{background:rgba(90,176,255,.1);box-shadow:inset 2px 0 0 var(--ac)}
.wr span:nth-child(2){color:var(--tx2)}.wr span:last-child{text-align:right}
.wr small{display:block;color:var(--mut);font:11px var(--sans)}

/* tarjetas de los paneles */
.al{padding:4px 12px 14px;font:12.5px var(--sans)}
.al h6,.card h6{display:flex;align-items:center;gap:10px;margin:16px 2px 8px;font:600 10px var(--sans);letter-spacing:.14em;color:var(--mut2);text-transform:uppercase}
.al h6::after,.card h6::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.al label,.sw{display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;margin:0 0 6px;border-radius:var(--r2);background:var(--surf);border:1px solid var(--line);cursor:pointer;box-shadow:var(--hi);transition:border-color .15s,background .15s}
.al label:hover,.sw:hover{border-color:var(--line2);background:rgba(20,34,60,.7)}
.sw span{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.sw b{font:500 12.5px var(--sans);color:var(--tx)}.sw small{font:11.5px/1.4 var(--sans);color:var(--mut)}
.al .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px;font:12px var(--mono);border-bottom:1px solid rgba(148,180,255,.06);color:var(--tx2)}
.al .it:last-child{border-bottom:0}
.al .it button{height:24px;padding:0 9px;font-size:11px}
.al p{color:var(--mut);margin:6px 2px;line-height:1.55;font-size:12px}
.al p b{color:var(--tx2);font-weight:600}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 0 10px;box-shadow:var(--hi)}
.card h6{margin-top:2px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 2px}
.stat div{background:rgba(6,12,24,.6);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.stat small{display:block;font:600 9px var(--sans);letter-spacing:.13em;color:var(--mut2);text-transform:uppercase}
.stat b{font:600 15px var(--mono);letter-spacing:-.01em}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px 10px;color:var(--mut);font-size:12px;line-height:1.5}
.empty svg{width:26px;height:26px;stroke:var(--mut2);fill:none;stroke-width:1.5;margin-bottom:2px}
.btn-row{display:flex;gap:8px;margin-top:8px}.btn-row button{flex:1}
.wide{width:100%;margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 10px var(--sans);letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:rgba(148,180,255,.1);color:var(--tx2)}
.badge.ok{background:rgba(34,211,238,.12);color:#8ef0ff}.badge.live{background:rgba(255,209,102,.12);color:#ffe3a3}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.conn{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surf);margin-bottom:8px;box-shadow:var(--hi)}
.conn .lg{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:700 13px var(--disp);color:#fff;flex:0 0 auto}
.conn .tx{flex:1;min-width:0}.conn .tx b{display:block;font:600 13px var(--sans)}.conn .tx small{color:var(--mut);font-size:11.5px}
.conn button{height:28px;font-size:11.5px}
.acct{border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0;background:rgba(6,12,24,.55)}
.acct .row{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--tx2);padding:2px 0}.acct .row span:first-child{color:var(--mut);font-family:var(--sans)}
.acct .nm{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.acct .nm b{font:600 12.5px var(--sans)}
.bar{height:6px;border-radius:99px;background:rgba(148,180,255,.1);overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;border-radius:99px;background:var(--grad)}

/* ---- terminal ---- */
.termW .h{padding-top:6px}
.term{padding:0 12px 12px}.term .row{display:grid;grid-template-columns:70px 1fr 1fr 62px;gap:6px}
.term input{width:100%;font:500 12px var(--mono);text-align:center}
.term .b{background:linear-gradient(135deg,rgba(34,211,238,.32),rgba(34,211,238,.14));border-color:rgba(34,211,238,.45);color:#c9f7ff;font-weight:700;letter-spacing:.04em}
.term .s{background:linear-gradient(135deg,rgba(61,90,254,.5),rgba(61,90,254,.22));border-color:rgba(61,90,254,.6);color:#dde4ff;font-weight:700;letter-spacing:.04em}
.term .b:hover{box-shadow:0 0 16px rgba(34,211,238,.3)}.term .s:hover{box-shadow:0 0 16px rgba(61,90,254,.4)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;font:11.5px var(--mono);padding:10px;border:1px solid var(--line);border-radius:10px;background:rgba(6,12,24,.55)}
.kp div{display:flex;justify-content:space-between}.kp span{color:var(--mut);font-family:var(--sans)}.kp b{font-weight:500}
.mini{height:24px;padding:0 9px;font-size:10.5px;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips button{height:26px;padding:0 11px;font-size:11.5px;border-radius:99px}
.chips button.on{background:rgba(90,176,255,.18);border-color:rgba(90,176,255,.55);color:#fff;box-shadow:0 0 12px rgba(61,90,254,.25)}
.fld{display:grid;grid-template-columns:1fr 120px;gap:8px 10px;align-items:center;margin:7px 2px;color:var(--tx2);font-size:12px}
.fld input,.fld select{width:100%}
.warn{border:1px solid rgba(255,209,102,.35);background:linear-gradient(135deg,rgba(255,209,102,.1),rgba(255,209,102,.03));border-radius:10px;padding:10px 12px;color:#ffe3a3;font-size:12px;line-height:1.5;margin:8px 0}
.info2{border:1px solid rgba(90,176,255,.25);background:rgba(90,176,255,.06);border-radius:10px;padding:10px 12px;color:var(--tx2);font-size:12px;line-height:1.5;margin:8px 0}

/* ---- ventanas flotantes ---- */
.pop{position:absolute;right:14px;top:58px;z-index:8;background:rgba(9,17,33,.94);backdrop-filter:blur(20px);border:1px solid var(--line2);border-radius:14px;padding:16px;width:440px;font:11px var(--mono);display:none;
  box-shadow:0 24px 70px rgba(0,0,0,.65),var(--hi);max-height:80vh;overflow:auto}
.pop h4{margin:0 0 6px;font:600 15px var(--disp);letter-spacing:-.01em}.pop p{margin:0 0 10px;color:var(--mut);font:12px/1.5 var(--sans)}
.pop table{width:100%;border-collapse:collapse}.pop td,.pop th{text-align:right;padding:5px 4px;font-weight:400;border-bottom:1px solid rgba(148,180,255,.06)}.pop th{color:var(--mut2);font:600 9.5px var(--sans);letter-spacing:.1em}
.pop td:first-child,.pop th:first-child{text-align:left}
#indP,#helpP{width:360px;font:12.5px var(--sans)}
#indP label{display:flex;align-items:center;gap:10px;padding:9px 10px;margin:0 0 5px;border-radius:9px;background:var(--surf);border:1px solid var(--line);cursor:pointer}
#indP label:hover{border-color:var(--line2)}
#indP label span{flex:1}#indP small{color:var(--mut);font-size:11.5px}
#indP label input[type=checkbox]{order:3}#indP label input[type=number]{order:2;width:70px;height:26px;font:500 11px var(--mono)}
#indP h5{margin:14px 2px 7px;font:600 10px var(--sans);letter-spacing:.14em;color:var(--mut2)}
#helpP kbd{font:500 11px var(--mono);background:var(--surf2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:2px 7px;margin-right:10px;min-width:26px;display:inline-block;text-align:center;color:var(--tx)}
#helpP div{padding:5px 0;color:var(--tx2)}
.rp{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(61,90,254,.16),rgba(90,176,255,.06));font:11px var(--mono);color:var(--tx2)}
.rp input[type=range]{flex:1;width:auto}.rp b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.16em;font-weight:700}

/* ---- barra de estado ---- */
.foot{display:flex;align-items:center;gap:8px;padding:5px 12px;border-top:1px solid var(--line);font:11px var(--mono);color:var(--mut);background:rgba(4,9,19,.85)}
.chip{font:500 10.5px var(--mono);color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap;background:var(--surf);display:inline-flex;align-items:center}
.chip i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mut2);margin-right:7px}
.chip.ok i{background:var(--up);box-shadow:0 0 8px rgba(34,211,238,.8);animation:pulse 2.4s infinite}.chip.bad i{background:#ff6b6b;box-shadow:0 0 8px rgba(255,107,107,.7)}.chip.ok{color:var(--tx)}
@keyframes pulse{50%{opacity:.45}}
#aud{cursor:pointer}

/* ---- avisos ---- */
#toast{position:fixed;right:18px;bottom:46px;z-index:40;display:flex;flex-direction:column;gap:10px}
#toast div{position:relative;background:rgba(10,19,37,.95);backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:12px;padding:12px 16px 12px 18px;min-width:270px;max-width:360px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);font:12.5px/1.45 var(--sans);color:var(--tx2);animation:tin .35s cubic-bezier(.2,.8,.3,1.2)}
#toast div::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:99px;background:var(--grad)}
#toast b{display:block;color:#fff;margin-bottom:3px;font:600 13px var(--sans)}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.97)}}
#ask{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(2,5,11,.7);backdrop-filter:blur(6px)}
#ask form{background:rgba(10,19,37,.97);border:1px solid var(--line2);border-radius:16px;padding:20px;width:340px;display:grid;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#ask b{font:600 15px var(--disp)}#ask input{height:38px;font-size:14px}#ask div{display:flex;gap:8px;justify-content:flex-end}
#askY{background:var(--grad)!important;border-color:transparent!important;color:#fff!important}

/* ---- diario y ventanas grandes ---- */
.mod{position:fixed;inset:0;z-index:45;background:rgba(2,5,11,.78);backdrop-filter:blur(10px);display:none;overflow:auto;padding:32px}
.mod>div{max-width:1200px;margin:0 auto;background:linear-gradient(180deg,rgba(11,20,39,.97),rgba(6,12,25,.97));border:1px solid var(--line2);border-radius:20px;padding:26px;box-shadow:0 40px 120px rgba(0,0,0,.6)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.kpis div{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:linear-gradient(180deg,rgba(20,34,62,.55),rgba(10,18,34,.55));box-shadow:var(--hi)}
.kpis small{display:block;font:600 9.5px var(--sans);letter-spacing:.14em;color:var(--mut2);margin-bottom:4px}.kpis b{font:600 22px var(--mono);letter-spacing:-.02em}
.jt{width:100%;border-collapse:collapse;font:12px var(--mono)}.jt td,.jt th{padding:9px 10px;border-bottom:1px solid rgba(148,180,255,.06);text-align:left}.jt th{color:var(--mut2);font:600 9.5px var(--sans);letter-spacing:.12em}
.jt img{width:110px;border-radius:8px;display:block;border:1px solid var(--line)}.jt tr{cursor:pointer}.jt tr:hover td{background:var(--hov)}

/* ---- varios gráficos ---- */
#grid{display:none;flex:1;gap:1px;background:var(--line);min-width:0}
#grid iframe{border:0;width:100%;height:100%;background:var(--bg)}
#grid.g2{grid-template-columns:1fr 1fr}#grid.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
body.multi #grid{display:grid}
body.multi .left,body.multi .right,body.multi .tools,body.multi .info,body.multi .one{display:none}
body.pane .logo,body.pane .right,body.pane .tools,body.pane .info,body.pane .foot,body.pane .nopane{display:none}
body.pane .top{padding:6px 8px}body.pane .top::after{display:none}
@media(max-width:900px){.right{display:none}}
.logo::before{content:"";display:inline-block;width:22px;height:18px;vertical-align:-4px;margin-right:9px;background:linear-gradient(#3d5afe,#3d5afe) 12px 0/6px 3px no-repeat,linear-gradient(#3d5afe,#3d5afe) 12px 4px/10px 3px no-repeat,linear-gradient(#5ab0ff,#5ab0ff) 0 7px/22px 2px no-repeat,linear-gradient(#22d3ee,#22d3ee) 1px 11px/10px 3px no-repeat,linear-gradient(#22d3ee,#22d3ee) 5px 15px/6px 3px no-repeat}
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="index.html">NORTHPOINT <b>DEPTH</b></a>
  <select id="symSel" class="one" title="Mercado"></select>
  <select id="barSel" class="one" title="Tipo de barra">
    <optgroup label="Tiempo"><option value="time:5000">5 s</option><option value="time:15000">15 s</option><option value="time:30000">30 s</option><option value="time:60000" selected>1 min</option><option value="time:180000">3 min</option><option value="time:300000">5 min</option><option value="time:900000">15 min</option><option value="time:1800000">30 min</option><option value="time:3600000">1 h</option><option value="time:14400000">4 h</option></optgroup>
    <optgroup label="Order flow"><option value="ticks:500">500 ticks</option><option value="ticks:2000">2000 ticks</option><option value="volume:V">Volumen</option><option value="delta:D">Delta</option><option value="range:R">Rango</option></optgroup>
  </select>
  <select id="modeSel" class="one" title="Qué muestra cada cluster"><option value="ba">Bid x Ask</option><option value="delta">Delta</option><option value="vol">Volumen</option><option value="prof">Perfil bid/ask</option></select>
  <select id="grpSel" class="one nopane" title="Agrupar precio"></select>
  <select id="imbSel" class="one nopane" title="Desbalance"><option value="2">Desbal. 200%</option><option value="3" selected>Desbal. 300%</option><option value="4">Desbal. 400%</option></select>
  <div class="seg one" id="zoom" title="Nivel de detalle (teclas 1, 2, 3)"><button data-w="7">Velas</button><button data-w="30">Clusters</button><button data-w="96">Números</button></div>
  <div class="seg one nopane" id="tabs"><button data-v="fp" class="on">Gráfico</button><button data-v="hm">Heatmap</button></div>
  <label class="ctl one nopane" id="conW">Liquidez <input id="con" type="range" min="0.3" max="3" step="0.05" value="1"></label>
  <button id="indB" class="one nopane pri">Indicadores</button>
  <button id="fol" class="one nopane" title="Volver a seguir el precio (F)">Seguir</button>
  <button id="rpB" class="one nopane">Replay</button>
  <select id="depSel" class="one nopane" title="Cuánta historia tick a tick se carga"><option value="0.5">Ticks 30 min</option><option value="2">Ticks 2 h</option><option value="6" selected>Ticks 6 h</option></select>
  <select id="tplSel" class="one nopane" title="Plantillas del gráfico"></select>
  <button id="shot" class="one nopane" title="Guardar imagen del gráfico">Captura</button>
  <div class="seg nopane" id="lay" title="Cuántos gráficos a la vez">
    <button data-n="1" class="on"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1"/></svg></button>
    <button data-n="2"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M8 3v10"/></svg></button>
    <button data-n="4"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M8 3v10M2 8h12"/></svg></button>
  </div>
  <div class="sp"></div>
  <a id="dlMac" class="nopane" href="https://github.com/studioamr/northpoint-depth/releases/latest/download/NORTHPOINT-DEPTH-mac-arm64.dmg" title="App de escritorio para Mac con chip Apple" style="font:12px var(--sans);color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 10px;text-decoration:none">App para Mac</a>
  <a id="dlWin" class="nopane" href="https://github.com/studioamr/northpoint-depth/releases/latest/download/NORTHPOINT-DEPTH-Windows.exe" title="App de escritorio para Windows" style="font:12px var(--sans);color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 10px;text-decoration:none">Windows</a>
  <button id="helpB" class="nopane" title="Atajos de teclado">?</button>
  <button id="usr" class="nopane" title="Cerrar sesión"></button>
</div>
<div class="info" id="info"></div>
<div class="rp" id="rp" style="display:none"><b>REPLAY</b><button id="rpP">Pausa</button>
  <select id="rpS"><option value="1">1x</option><option value="5">5x</option><option value="20" selected>20x</option><option value="60">60x</option><option value="300">300x</option></select>
  <input id="rpR" type="range" min="0" max="1000" value="0"><span id="rpT"></span><button id="rpX">Volver a en vivo</button></div>
<div id="audP" class="pop"></div><div id="trkP" class="pop"></div><div id="indP" class="pop"></div><div id="helpP" class="pop"></div>
<div class="main">
  <div class="tools" id="tools">
    <button data-t="cur" class="on" title="Cursor (Esc)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg></button>
    <button data-t="h" title="Línea horizontal (H)"><svg viewBox="0 0 24 24"><path d="M3 12h18"/><circle cx="12" cy="12" r="2"/></svg></button>
    <button data-t="line" title="Línea de tendencia (T)"><svg viewBox="0 0 24 24"><path d="M4 19L20 5"/><circle cx="4" cy="19" r="1.6"/><circle cx="20" cy="5" r="1.6"/></svg></button>
    <button data-t="rect" title="Zona / rectángulo (R)"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="10" rx="1"/></svg></button>
    <button data-t="ruler" title="Regla: precio, %, barras, volumen y delta (M)"><svg viewBox="0 0 24 24"><path d="M4 16L16 4l4 4L8 20z"/><path d="M8 12l2 2M11 9l2 2M14 6l2 2"/></svg></button>
    <button data-t="alert" title="Alerta de precio (A)"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg></button>
    <hr>
    <button id="delAll" title="Borrar todos los dibujos"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button>
  </div>
  <div class="left">
    <div class="read" id="read"></div>
    <div class="cv"><canvas id="fp"></canvas><canvas id="hm" style="display:none"></canvas></div>
  </div>
  <div class="right">
    <div class="rt" id="rtabs"><button data-p="pBook" class="on">Operar</button><button data-p="pWatch">Mercados</button><button data-p="pAl">Avisos</button><button data-p="pJr">Diario</button><button data-p="pAc">Cuenta</button></div>
    <div class="pn" id="pBook">
      <div class="termW"><div class="h"><span>Orden rápida</span><button id="trkB" class="mini">Historial</button></div>
      <div class="term"><div class="row"><input id="simQ" type="number" step="any" min="0"><button id="buy" class="b">COMPRAR</button><button id="sell" class="s">VENDER</button><button id="flat">Cerrar</button></div>
        <div class="kp"><div><span>Posición</span><b id="sPos">0</b></div><div><span>Precio medio</span><b id="sAvg">-</b></div><div><span>P/L abierto</span><b id="sOpen">0.00</b></div><div><span>P/L realizado</span><b id="sReal">0.00</b></div><div><span>Stop</span><b id="sSL" class="d" style="cursor:pointer" title="Clic para quitarlo">-</b></div><div><span>Objetivo</span><b id="sTP" class="u" style="cursor:pointer" title="Clic para quitarlo">-</b></div></div></div></div>
      <div class="h" style="border-top:1px solid var(--line)"><span>Profundidad</span><span id="spr"></span></div>
      <div id="domW"><canvas id="dom"></canvas></div>
      <div class="h" style="border-top:1px solid var(--line)"><span>Ritmo · 60 s</span><span id="spdT"></span></div>
      <canvas id="spd"></canvas>
      <div class="h" style="border-top:1px solid var(--line)"><span>Cinta</span><select id="tapeMin"></select></div>
      <div id="tape"></div>
    </div>
    <div class="pn" id="pWatch" hidden><div id="corr"></div><div class="list" id="watch"></div></div>
    <div class="pn" id="pAl" hidden><div class="al" id="alBox"></div><div class="al" id="alBox2"></div></div>
    <div class="pn" id="pJr" hidden><div class="al" id="jrBox"></div></div>
    <div class="pn" id="pAc" hidden><div class="al" id="acBox"></div></div>
  </div>
  <div id="grid"></div>
</div>
<div class="foot">
  <div class="chip" id="st"><i></i>conectando</div>
  <div class="chip" id="aud"><i></i>Auditoría…</div>
  <div class="sp"></div>
  <span id="licT"></span><span id="clock"></span>
</div>
<div id="toast"></div>
<div id="ask"><form><b id="askT"></b><input id="askI" type="text" maxlength="40" autocomplete="off"><div><button type="button" id="askN">Cancelar</button><button id="askY" style="background:var(--ac);color:#03060c;border-color:var(--ac)">Aceptar</button></div></form></div>
<script src="js/auth.js"></script>
<script src="js/lic.js"></script>
<script src="js/engine.js"></script>
<script src="js/feed-binance.js"></script>
<script src="js/app.js"></script>
<script src="js/pro.js"></script>
</body>
</html>
