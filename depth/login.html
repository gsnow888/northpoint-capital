<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>if(location.hostname==='studioamr.github.io')location.replace('https://northpointcapital.io/depth/'+location.pathname.replace(/^\/northpoint-depth\/?/,'')+location.search+location.hash)</script>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · NORTHPOINT DEPTH</title>
<style>
:root{--bg:#03060c;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);--tx:#e8ecf3;--mut:#8791a1;--ac:#5ab0ff;--dn:#3d5afe;--sans:Inter,-apple-system,"Helvetica Neue",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{min-height:100%;display:grid;grid-template-columns:minmax(340px,460px) 1fr}
.side{padding:34px 40px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#040a16;position:relative;z-index:2}
.logo{font-weight:700;letter-spacing:.16em;font-size:13px;color:inherit;text-decoration:none}.logo b{color:var(--ac)}
.logo::before{content:"";display:inline-block;width:22px;height:18px;vertical-align:-4px;margin-right:9px;background:linear-gradient(#3d5afe,#3d5afe) 12px 0/6px 3px no-repeat,linear-gradient(#3d5afe,#3d5afe) 12px 4px/10px 3px no-repeat,linear-gradient(#5ab0ff,#5ab0ff) 0 7px/22px 2px no-repeat,linear-gradient(#22d3ee,#22d3ee) 1px 11px/10px 3px no-repeat,linear-gradient(#22d3ee,#22d3ee) 5px 15px/6px 3px no-repeat}
.box{margin:auto 0;padding:30px 0}
h1{font-size:30px;letter-spacing:-.03em;margin:0 0 6px}
.box>p{color:var(--mut);margin:0 0 24px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:20px}
.seg button{font:600 13px var(--sans);color:var(--mut);background:none;border:0;border-radius:9px;padding:9px;cursor:pointer}
.seg button.on{background:rgba(90,176,255,.16);color:var(--tx)}
label{display:block;font-size:12.5px;color:var(--mut);margin:0 0 14px}
input{display:block;width:100%;margin-top:6px;font:15px var(--sans);color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 13px;outline:0}
input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(90,176,255,.16)}
.go{width:100%;font:600 15px var(--sans);padding:13px;border-radius:11px;border:0;background:var(--ac);color:#03060c;cursor:pointer;margin-top:6px}
.go:hover{filter:brightness(1.08)}
#err{color:var(--dn);font-size:13px;min-height:20px;margin:10px 0 0}
.fine{color:var(--mut);font-size:12px;margin-top:18px}
.live{position:relative;overflow:hidden}
.live iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;opacity:.55}
.live:after{content:"";position:absolute;inset:0;background:radial-gradient(700px 480px at 60% 45%,rgba(90,176,255,.2),transparent 70%)}
.live q{position:absolute;left:44px;bottom:40px;z-index:2;quotes:none;font-size:clamp(22px,2.6vw,34px);line-height:1.12;letter-spacing:-.025em;font-weight:700;max-width:440px}
.live q span{display:block;font:500 13px var(--sans);letter-spacing:0;color:var(--mut);margin-top:10px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.live{display:none}.side{border:0;padding:26px 22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <a class="logo" href="index.html">NORTHPOINT <b>DEPTH</b></a>
    <div class="box">
      <h1 id="ttl">Inicia sesión</h1>
      <p id="sub">Entra a tu plataforma de order flow.</p>
      <div class="seg" id="seg"><button data-m="in" class="on">Iniciar sesión</button><button data-m="up">Crear cuenta</button></div>
      <form id="f" novalidate>
        <label id="nameW" hidden>Nombre<input id="name" autocomplete="name"></label>
        <label>Correo<input id="email" type="email" autocomplete="email" required></label>
        <label>Contraseña<input id="pw" type="password" autocomplete="current-password" required></label>
        <button class="go" id="go">Entrar</button>
        <div id="err" role="alert"></div>
      </form>
      <p class="fine">Tu cuenta se guarda en este equipo: separa tu perfil y tu historial de operaciones en este navegador.</p>
    </div>
    <div class="fine" style="margin:0">NorthPoint &copy; 2026</div>
  </div>
  <div class="live">
    <q>Order flow tick a tick.<span>Cripto, índices, materias primas y acciones</span></q></div>
</div>
<script src="js/auth.js"></script>
<script>
const $=id=>document.getElementById(id);let mode='in';
if(NPAuth.session())location.replace('app.html');
function set(m){mode=m;for(const b of $('seg').children)b.classList.toggle('on',b.dataset.m===m);
  $('nameW').hidden=m==='in';$('ttl').textContent=m==='in'?'Inicia sesión':'Crea tu cuenta';
  $('sub').textContent=m==='in'?'Entra a tu plataforma de order flow.':'Un minuto y estás dentro de la plataforma.';
  $('go').textContent=m==='in'?'Entrar':'Crear cuenta y entrar';$('pw').autocomplete=m==='in'?'current-password':'new-password';$('err').textContent=''}
$('seg').onclick=e=>{const b=e.target.closest('button');if(b)set(b.dataset.m)};
if(location.hash==='#registro')set('up');
if(new URLSearchParams(location.search).get('pagado')==='1'){set('up');$('sub').textContent='Pago recibido. Crea tu cuenta para entrar a la plataforma.';$('sub').style.color='#22d3ee'}
addEventListener('hashchange',()=>set(location.hash==='#registro'?'up':'in'));
$('f').onsubmit=async e=>{e.preventDefault();$('err').textContent='';
  try{if(mode==='up')await NPAuth.register($('name').value,$('email').value,$('pw').value);else await NPAuth.login($('email').value,$('pw').value);
    location.href='app.html'}catch(x){$('err').textContent=x.message}};
</script>
</body>
</html>
