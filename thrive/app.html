<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thrive Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23060510'/%3E%3Cpath fill='%23fff' d='M12 3l1.6 7.4L21 12l-7.4 1.6L12 21l-1.6-7.4L3 12l7.4-1.6z'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060510">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thrive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#060510;--card:#12111a;--card2:#181722;--line:rgba(203,208,235,.09);--line2:rgba(203,208,235,.14);--tx:#f7f7f7;--mut:#9899a3;--dim:#62636e;--acc:#516af6;--up:#22c55e;--dn:#ef4444;--upbg:rgba(34,197,94,.12);--dnbg:rgba(239,68,68,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:12px/1.35 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.m{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.dim{color:var(--dim)}.sm{font-size:11px}
.app{display:grid;grid-template-rows:48px 1fr 26px;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:16px;padding:0 14px;border-bottom:1px solid var(--line);position:relative;z-index:20}
.logo{font-size:19px;font-weight:600;letter-spacing:-.045em;display:flex;align-items:center;gap:7px}
.logo svg{width:14px;height:14px;fill:#fff;stroke:none;filter:drop-shadow(0 0 5px rgba(140,160,255,.9))}
.live{font-size:9px;letter-spacing:.16em;color:var(--up);border:1px solid rgba(34,197,94,.35);border-radius:99px;padding:2px 7px;display:flex;gap:5px;align-items:center}
.live:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--up);animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}
.searchw{margin:0 auto;width:min(440px,40vw);position:relative}
.search{height:30px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--dim)}
.search input{flex:1;font-size:12px;color:var(--tx);min-width:0}
.kbd{font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line2);color:var(--mut)}
.sres{position:absolute;top:36px;left:0;right:0;background:#100f18;border:1px solid var(--line2);border-radius:12px;max-height:420px;overflow-y:auto;display:none;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.sres.on{display:block}
.sres .h{padding:8px 12px 4px;color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.sres .r{display:flex;align-items:center;gap:9px;padding:7px 12px;cursor:pointer}
.sres .r:hover{background:rgba(203,208,235,.06)}
.mode{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:2px;font-size:11px}
.mode button{padding:4px 9px;border-radius:7px;color:var(--mut)}
.mode button.on{background:#1c1b28;color:var(--tx)}
.mode button[data-mode=real].on{background:rgba(34,197,94,.14);color:var(--up)}
.steps{display:grid;gap:10px;margin:14px 0}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.step i{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:11px;background:#22212d}
.step.ok i{background:var(--up);color:#04130a}
.step .t{flex:1}
.step .btn{height:28px;font-size:12px}
.tpsl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tpsl input{height:32px;border-radius:8px;background:var(--card);border:1px solid var(--line);padding:0 8px;font-family:'Geist Mono',monospace;font-size:11.5px;min-width:0}
.realtag{font-size:10px;color:var(--up);border:1px solid rgba(34,197,94,.35);border-radius:6px;padding:1px 5px;margin-left:6px}
.wallet{display:flex;gap:14px;align-items:center;text-align:right;font-size:11px}
.wallet a{color:var(--acc);cursor:pointer}
.me{width:28px;height:28px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--acc);cursor:pointer}
.bell{position:relative;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--mut)}
.bell:hover{background:var(--card)}
.bell svg{width:16px;height:16px}
.bell b{position:absolute;top:2px;right:2px;min-width:14px;height:14px;border-radius:7px;background:var(--acc);color:#fff;font-size:9px;display:none;place-items:center;padding:0 3px}
.bell b.on{display:grid}
.drop{position:absolute;top:44px;right:14px;width:340px;background:#100f18;border:1px solid var(--line2);border-radius:12px;display:none;box-shadow:0 20px 50px rgba(0,0,0,.6);max-height:460px;overflow-y:auto;z-index:30}
.drop.on{display:block}
.drop .h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.ni{display:flex;gap:9px;padding:9px 12px;border-bottom:1px solid rgba(203,208,235,.04);cursor:pointer}
.ni:hover{background:rgba(203,208,235,.04)}
.main{display:grid;grid-template-columns:var(--sw,272px) minmax(0,1fr) var(--rw,304px);min-height:0;position:relative}
.main.noside{--sw:0px!important}.main.noside .side{display:none}.main.noright{--rw:0px!important}.main.noright .right{display:none}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 8px 0;font-size:12px;flex-wrap:wrap}
.tabs button{padding:6px 8px;border-radius:7px;color:var(--mut)}
.tabs button.on{color:var(--tx);background:var(--card)}
.filt{display:flex;gap:4px;padding:8px;font-size:11px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filt button{padding:4px 7px;border-radius:6px;color:var(--mut)}
.filt button.on{background:var(--card);color:var(--tx)}
.list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#22212d transparent}
.it{display:flex;align-items:center;gap:9px;padding:8px 10px;cursor:pointer;border-left:2px solid transparent}
.it:hover{background:rgba(203,208,235,.03)}
.it.on{background:var(--card);border-left-color:var(--acc)}
.it .g{flex:1;min-width:0}
.it .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .r{text-align:right;white-space:nowrap}
.ico{position:relative;flex:none;display:block;border-radius:50%;background:#1b1a26}
.ico img,.ico svg{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.ico .lt{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:10px;color:#fff}
.ico .tag{position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);font:600 7px/1 'Geist Mono',monospace;background:#0b1530;color:#cfd8ff;padding:2px 3px;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.15);white-space:nowrap}
.load{padding:24px;text-align:center;color:var(--dim);line-height:1.5}
.err{padding:16px;color:#fca5a5;font-size:11px}
.center{position:relative;display:grid;grid-template-rows:auto 1fr var(--bh,290px);min-width:0;min-height:0}
.center.focus{--bh:0px!important}.center.focus .bottom{display:none}
.ihead{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);min-width:0}
.ihead h1{font-size:15px;font-weight:600;white-space:nowrap}
.ihead .meta{min-width:0}
.ihead .meta .mut{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{margin-left:auto;display:flex;gap:20px;text-align:center;flex:none}
.stats .k{color:var(--mut);font-size:10.5px;white-space:nowrap}
.stats .v{font-size:14px;font-weight:500;margin-top:1px;white-space:nowrap}
.star{color:var(--dim);padding:4px}
.star.on{color:#fbbf24}
.star svg{width:16px;height:16px}
.chartw{position:relative;display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--line)}
.tool{display:flex;align-items:center;gap:12px;padding:6px 12px;color:var(--mut);font-size:11.5px}
.tool b{color:var(--tx);font-weight:500}
.tool .sep{width:1px;height:14px;background:var(--line2)}
.tf button{padding:3px 6px;border-radius:5px;color:var(--mut)}
.tf button.on{color:var(--tx);background:var(--card)}
.cvw{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.cvmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);pointer-events:none}
.ovr{display:flex;gap:14px;align-items:center;padding:6px 12px;color:var(--mut);font-size:11px;border-top:1px solid var(--line);flex-wrap:wrap}
.ovr label{display:flex;gap:5px;align-items:center;cursor:pointer}
.ovr input{accent-color:var(--acc)}
.tip{position:absolute;pointer-events:none;background:#15141f;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:11px;display:none;z-index:5;min-width:170px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) var(--pw,380px);min-height:0;position:relative}
.bottom.swap .pane:first-child{order:2}.bottom.swap{grid-template-columns:var(--pw,380px) minmax(0,1fr)}
.rz{position:absolute;z-index:6;background:transparent;transition:background .15s}
.rz:hover,.rz.on{background:rgba(81,106,246,.55)}
.rz.v{top:0;bottom:0;width:5px;cursor:col-resize;margin-left:-2px}
.rz.h{left:0;right:0;height:5px;cursor:row-resize;margin-top:-2px}
body.resizing{cursor:col-resize;user-select:none}body.resizing.rowr{cursor:row-resize}
.lay{display:flex;gap:2px;margin-left:8px}
.lay button{width:24px;height:22px;border-radius:6px;color:var(--mut);display:grid;place-items:center}
.lay button:hover{background:var(--card);color:var(--tx)}
.lay button.on{color:#aab4ff}
.lay svg{width:14px;height:14px}
.ptab{display:flex;gap:2px}
.ptab button{padding:3px 8px;border-radius:6px;color:var(--mut);font-size:11.5px}
.ptab button.on{background:var(--card);color:var(--tx)}
.book{font-family:'Geist Mono',monospace;font-size:11.5px}
.book .lv{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;padding:3px 12px;cursor:pointer}
.book .lv:hover{background:rgba(203,208,235,.04)}
.book .lv i{position:absolute;top:1px;bottom:1px;right:0;opacity:.16}
.book .lv span{position:relative;text-align:right}.book .lv span:first-child{text-align:left}
.book .ask span:first-child{color:var(--dn)}.book .bid span:first-child{color:var(--up)}
.book .ask i{background:var(--dn)}.book .bid i{background:var(--up)}
.book .mid{display:flex;justify-content:space-between;padding:6px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-family:'Geist Mono',monospace;font-size:11.5px}
.book .hd{display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px 12px;color:var(--dim);font-size:10.5px}.book .hd span{text-align:right}.book .hd span:first-child{text-align:left}
.kbdl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:12px 0 16px;font-size:12px}
.kbdl b{font-family:'Geist Mono',monospace;background:var(--card);border:1px solid var(--line2);border-radius:6px;padding:1px 7px;text-align:center;font-weight:500}
.pane{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.pane:last-child{border-right:0}
.ph{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:11.5px}
.ph b{font-weight:500}
.ph .rt{margin-left:auto;display:flex;gap:12px;color:var(--mut)}
.scroll{flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:#22212d transparent}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:400;color:var(--dim);font-size:10.5px;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:7px 10px;border-bottom:1px solid rgba(203,208,235,.04);vertical-align:middle;white-space:nowrap}
tr.cl{cursor:pointer}
tr.cl:hover td{background:rgba(203,208,235,.03)}
.av{width:24px;height:24px;border-radius:50%;flex:none;object-fit:cover;background:#1a1925}
.who{display:flex;gap:8px;align-items:center}
.who .nm{max-width:140px;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;padding:2px 6px;border-radius:5px;white-space:nowrap}
.badge.b{background:var(--upbg);color:var(--up)}.badge.s{background:var(--dnbg);color:var(--dn)}
.fl{animation:fl .9s ease}
@keyframes fl{from{background:rgba(81,106,246,.2)}to{background:transparent}}
.fol{color:var(--acc);font-size:10px;margin-left:4px}
.prof{position:absolute;inset:0;background:var(--bg);z-index:8;overflow-y:auto;display:none;padding:16px 18px 30px}
.prof.on{display:block}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--mut);margin-bottom:12px}
.phead{display:flex;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.phead img{width:60px;height:60px;border-radius:50%;object-fit:cover}
.phead h2{font-size:20px;font-weight:600;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .k{color:var(--mut);font-size:10.5px}.kpi .v{font-size:16px;margin-top:2px}
.sect{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.sect h3{font-size:12.5px;font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.sect .scrollx{overflow-x:auto}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;background:var(--acc);color:#fff;font-weight:500}
.btn.gh{background:var(--card2);border:1px solid var(--line2);color:var(--tx)}
.btn:disabled{opacity:.35;cursor:default}
.right{border-left:1px solid var(--line);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bs button{height:34px;border-radius:9px;background:var(--card);color:var(--mut);font-weight:500;font-size:13px}
.bs button.on.buy{background:var(--upbg);color:var(--up);box-shadow:inset 0 0 0 1px rgba(34,197,94,.4)}
.bs button.on.sell{background:var(--dnbg);color:var(--dn);box-shadow:inset 0 0 0 1px rgba(239,68,68,.4)}
.amt{display:flex;align-items:center;height:52px;border-radius:11px;background:var(--card);border:1px solid var(--line);padding:0 12px;gap:8px}
.amt input{flex:1;font-family:'Geist Mono',monospace;font-size:22px;min-width:0}
.amt input::placeholder{color:var(--dim)}
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pre button{height:30px;border-radius:8px;background:var(--card);font-family:'Geist Mono',monospace;font-size:11.5px;color:#cfd0d8}
.pre button:hover{background:#1a1925}
.lev{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--mut)}
.lev input{flex:1;accent-color:var(--acc)}
.go{height:40px;border-radius:10px;font-weight:600;font-size:13px}
.go.buy{background:var(--up);color:#04130a}.go.sell{background:var(--dn);color:#fff}
.go:disabled{opacity:.35;cursor:default}
.est{font-size:11px;color:var(--dim);display:grid;gap:3px}
.est div{display:flex;justify-content:space-between;gap:8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.box h3{font-size:13px;font-weight:500;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.chg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.chg div{text-align:center;padding:6px 0;border-radius:7px;font-size:10.5px;background:rgba(203,208,235,.04)}
.bar{display:flex;height:4px;border-radius:2px;overflow:hidden;margin:4px 0 10px;background:var(--dn)}
.bar i{display:block;height:100%}
.bl{display:flex;justify-content:space-between;font-size:11px}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.links a{padding:4px 8px;border-radius:6px;background:rgba(203,208,235,.07);font-size:11px}
.links a:hover{background:rgba(203,208,235,.12)}
.ptabs{display:flex;gap:4px;font-size:11px}
.ptabs button{padding:3px 7px;border-radius:6px;color:var(--mut)}
.ptabs button.on{background:rgba(81,106,246,.15);color:#aab4ff}
.pos{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:8px}
.pos:last-child{border-bottom:0}
.pos .l{display:flex;gap:8px;align-items:center;min-width:0;cursor:pointer;flex:1}
.xbtn{font-size:11px;color:var(--mut);padding:2px 6px;border-radius:5px;border:1px solid var(--line2)}
.xbtn:hover{color:var(--tx)}
.foot{display:flex;align-items:center;gap:18px;padding:0 12px;border-top:1px solid var(--line);font-size:11px;color:var(--mut);overflow:hidden;white-space:nowrap}
.foot .st{margin-left:auto;display:flex;gap:5px;align-items:center}
.foot .st i{width:6px;height:6px;border-radius:50%;background:var(--up)}
.foot .st.off i{background:var(--dn)}
.toasts{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);display:grid;gap:6px;z-index:40;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:#15141f;border:1px solid var(--line2);border-radius:12px;padding:10px 14px;font-size:12px;animation:fl .3s;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50}
.modal.on{display:grid}
.modal .in{width:min(380px,92vw);background:#100f18;border:1px solid var(--line2);border-radius:18px;padding:18px}
.modal h3{font-size:16px;font-weight:500;margin-bottom:4px}
.mtabs{display:none}
@media (max-width:1180px){.main{grid-template-columns:240px 1fr 284px}.bottom{grid-template-columns:1fr}.bottom .pane:last-child{display:none}.stats>div:nth-child(n+5){display:none}.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){
 .rz,.lay{display:none!important}
 .app{grid-template-rows:48px 1fr 56px}
 .main{grid-template-columns:minmax(0,1fr)}
 .center,.bottom,.pane,.chartw{min-width:0}
 .scroll{overflow:auto}
 #ohlc{display:none}
 .ovr{gap:10px}
 .side,.center,.right{display:none}
 .main[data-v="list"] .side,.main[data-v="trade"] .right{display:flex}
 .main[data-v="chart"] .center{display:grid;grid-template-rows:auto 1fr 240px}
 .right{border-left:0}
 .searchw{width:auto;flex:1;margin:0}
 .wallet>div:not(:first-child){display:none}
 .live,.top .kbd,.logo span{display:none}
 .mode button{padding:4px 6px}
 .stats{display:none}
 .foot{display:none}
 .mtabs{display:flex;border-top:1px solid var(--line);background:#08070f}
 .mtabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--mut)}
 .mtabs button.on{color:var(--tx)}
 .mtabs svg{width:18px;height:18px}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .drop{right:8px;left:8px;width:auto}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="logo" href="./"><svg viewBox="0 0 24 24"><path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2z"/></svg><span>thrive</span></a>

<script>
'use strict';
// ===== CONFIGURACIÓN DE DINERO REAL =====
// builder = la wallet de NorthPoint que cobra la comisión en cada orden real (necesita ≥100 USDC en su cuenta de perps de Hyperliquid).
// fee en décimas de punto base: 50 = 0.05 %. maxFeeRate es lo que el usuario autoriza una vez (debe ser ≥ fee).
const REAL={net:'main',builder:'',fee:50,maxFeeRate:'0.05%',slippage:0.01,
 // Solana (Jupiter): comisión de plataforma en puntos base y la cuenta de tokens de NorthPoint que la recibe (vacía = sin comisión)
 solFeeBps:0,solFeeAccount:'',solSlippageBps:100};
if(new URLSearchParams(location.search).get('net')==='test')REAL.net='test'; // red de pruebas para verificar firmas
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const HL='https://api.hyperliquid.xyz/info',GT='https://api.geckoterminal.com/api/v2';
const LB_URLS=['https://studioamr.github.io/northpoint-social/data/leaderboard.json','data/leaderboard.json'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2=n=>(+n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const usd=n=>(n<0?'-':'')+'$'+f2(Math.abs(n));
const sh=n=>{n=+n||0;const a=Math.abs(n),s=n<0?'-':'';return a>=1e9?s+'$'+(a/1e9).toFixed(2)+'B':a>=1e6?s+'$'+(a/1e6).toFixed(2)+'M':a>=1e3?s+'$'+(a/1e3).toFixed(1)+'K':s+'$'+a.toFixed(a<10?2:0)};
const pc=n=>(n>=0?'+':'')+(+n).toFixed(2)+'%';
const subz=z=>String(z).split('').map(c=>'₀₁₂₃₄₅₆₇₈₉'[+c]).join('');
const px=n=>{n=+n;if(!isFinite(n))return '—';const a=Math.abs(n);if(a>=1000)return f2(n);if(a>=1)return n.toFixed(a>=100?2:3);if(a===0)return '0';const z=Math.floor(-Math.log10(a));if(z>=4)return (n<0?'-':'')+'0.0'+subz(z)+String(Math.round(a*10**(z+3)));return n.toPrecision(4)};
const ago=t=>{const s=Math.max(0,Math.floor((Date.now()-t)/1000));return s<60?s+'s':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'};
const shortA=a=>a?a.slice(0,5)+'…'+a.slice(-4):'';
const hash=s=>{let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const avOf=a=>'av/'+String(hash(String(a||'').toLowerCase())%16+1).padStart(2,'0')+'.jpg';
const COL=['#516af6','#7a5cff','#00b894','#e17055','#d63384','#0984e3','#e0a100','#6c5ce7','#10b981','#f43f5e'];
const store={get(k,d){try{const v=localStorage.getItem('np.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('np.'+k,JSON.stringify(v))}catch(e){}}};

// ---------- red ----------
async function hl(body){const r=await fetch(HL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('Hyperliquid returned '+r.status);return r.json()}
const gtCache=new Map();let gtChain=Promise.resolve(),gtLast=0;
// GeckoTerminal permite ~30 consultas por minuto por IP; vamos a 1 cada 2.6 s y, si responde 429 (llega sin CORS), esperamos y reintentamos.
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function gt(path,ttl=30000){const c=gtCache.get(path);if(c&&Date.now()-c.t<ttl)return Promise.resolve(c.d);
 const p=gtChain.then(async()=>{const c2=gtCache.get(path);if(c2&&Date.now()-c2.t<ttl)return c2.d;
  for(let n=0;n<3;n++){const w=gtLast+2600-Date.now();if(w>0)await wait(w);gtLast=Date.now();let r;
   try{r=await fetch(GT+path,{headers:{Accept:'application/json'}})}catch(e){r=null}
   if(r&&r.ok){const d=await r.json();gtCache.set(path,{t:Date.now(),d});return d}
   if(r&&r.status!==429){if(c2)return c2.d;throw new Error('GeckoTerminal returned '+r.status)}
   gtLast=Date.now()+(n+1)*9000}
  if(c2)return c2.d;throw new Error('GeckoTerminal is busy; retrying in a few seconds')});
 gtChain=p.catch(()=>{});return p}

// ---------- estado ----------
const S={tab:'tokens',filt:{tokens:'trend',perps:'vol',mercados:'idx',rank:'month',feed:'all'},cur:null,tf:'5m',candles:[],bub:[],side:'buy',lev:5,ptab:'open',
 perps:[],xyz:[],tokens:{},lb:null,states:{},statesAt:0,mids:{},follow:store.get('follow',[]),favs:store.get('favs',[]),notes:store.get('notif',[]),seen:store.get('seen',{}),
 paper:store.get('paper',{cash:10000,pos:[],hist:[]}),trades:[]};
const savePaper=()=>store.set('paper',S.paper);
const isFol=a=>S.follow.includes(String(a||'').toLowerCase());
const allPerps=()=>S.perps.concat(S.xyz);

// ---------- íconos ----------
const FLAG=id=>`<defs><clipPath id="c${id}"><circle cx="16" cy="16" r="16"/></clipPath></defs><g clip-path="url(#c${id})"><rect width="32" height="32" fill="#fff"/>${[0,2,4,6,8,10,12].map(k=>`<rect y="${k*2.47}" width="32" height="2.47" fill="#c8102e"/>`).join('')}<rect width="15" height="17.3" fill="#0a3161"/>${[[3,3],[7,3],[11,3],[5,6.5],[9,6.5],[3,10],[7,10],[11,10],[5,13.5],[9,13.5]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r=".9" fill="#fff"/>`).join('')}</g>`;
const GOLD=`<circle cx="16" cy="16" r="16" fill="#2b2210"/><path fill="#e8b84a" d="M8 21l2.6-8h10.8L24 21z"/><path fill="#fff3c4" fill-opacity=".5" d="M11.3 14h9.4l.5 1.4h-10.4z"/>`;
const SILVER=`<circle cx="16" cy="16" r="16" fill="#1d2026"/><path fill="#cfd5de" d="M8 21l2.6-8h10.8L24 21z"/>`;
const OIL=`<circle cx="16" cy="16" r="16" fill="#241a10"/><path fill="#111" stroke="#f59e0b" stroke-width="1.4" d="M16 7.5c3 4.2 6 7.5 6 11a6 6 0 01-12 0c0-3.5 3-6.8 6-11z"/>`;
const SPECIAL={'xyz:XYZ100':['flag','NDX'],'xyz:SP500':['flag','SPX'],'xyz:GOLD':['gold'],'xyz:SILVER':['silver'],'xyz:PLATINUM':['silver'],'xyz:PALLADIUM':['silver'],'xyz:CL':['oil'],'xyz:BRENTOIL':['oil'],'xyz:NATGAS':['oil']};
let icoN=0;
function letter(sym){return `<span class="lt" style="background:${COL[hash(sym)%COL.length]}">${esc(String(sym).slice(0,3))}</span>`}
function icon(m,size){const id=++icoN;let inner,tag='';const sp=SPECIAL[m.id];
 if(sp){inner=`<svg viewBox="0 0 32 32">${sp[0]==='flag'?FLAG(id):sp[0]==='gold'?GOLD:sp[0]==='silver'?SILVER:OIL}</svg>`;if(sp[1])tag=`<b class="tag">${sp[1]}</b>`}
 else if(m.img)inner=`<img src="${esc(m.img)}" alt="" loading="lazy" data-sym="${esc(m.sym)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'lt',textContent:this.dataset.sym.slice(0,3)}))">`;
 else inner=letter(m.sym);
 return `<span class="ico" style="width:${size}px;height:${size}px">${inner}${tag}</span>`}

// ---------- mercados ----------
const IDX=['XYZ100','SP500','JP225','KR200','EWY','EWJ','EWZ','XLE','URNM','DRAM'],COMM=['GOLD','SILVER','CL','BRENTOIL','COPPER','NATGAS','PLATINUM','PALLADIUM'],FX=['JPY','EUR'];
const NAMES={XYZ100:'nasdaq 100',SP500:'s&p 500',JP225:'nikkei 225',KR200:'kospi 200',GOLD:'gold',SILVER:'silver',CL:'WTI crude',BRENTOIL:'brent crude',COPPER:'copper',NATGAS:'natural gas',PLATINUM:'platinum',PALLADIUM:'palladium',JPY:'japanese yen',EUR:'euro',NVDA:'nvidia',TSLA:'tesla',AAPL:'apple',MSFT:'microsoft',GOOGL:'alphabet (google)',AMZN:'amazon',META:'meta',AMD:'amd',NFLX:'netflix',COIN:'coinbase',HOOD:'robinhood',PLTR:'palantir',MSTR:'strategy',ORCL:'oracle',INTC:'intel',TSM:'tsmc',BABA:'alibaba',GME:'gamestop',COST:'costco',LLY:'eli lilly',MU:'micron',CRCL:'circle',RIVN:'rivian',SMSN:'samsung',SOFTBANK:'softbank',HYUNDAI:'hyundai',RKLB:'rocket lab',DKNG:'draftkings',HIMS:'hims & hers',MRVL:'marvell',BTC:'bitcoin',ETH:'ethereum',SOL:'solana',HYPE:'hyperliquid'};
function perpObj(u,c,dex,asset){const id=u.name,sym=id.replace(/^\w+:/,''),p=+c.markPx||+c.midPx||0,prev=+c.prevDayPx||p;
 return{kind:'perp',dex,id,sym,name:NAMES[sym]||(dex?sym.toLowerCase():sym+' perpetual'),img:'https://app.hyperliquid.xyz/coins/'+encodeURIComponent(id)+'.svg',px:p,prev,ch:prev?(p/prev-1)*100:0,vol:+c.dayNtlVlm||0,oi:(+c.openInterest||0)*p,fund:+c.funding||0,maxLev:u.maxLeverage||10,asset,szDec:u.szDecimals}}
let XYZ_IDX=null;
async function loadPerps(){if(XYZ_IDX==null){try{const d=await hl({type:'perpDexs'});XYZ_IDX=d.findIndex(x=>x&&x.name==='xyz')}catch(e){XYZ_IDX=-1}}const [m,x]=await Promise.all([hl({type:'metaAndAssetCtxs'}),hl({type:'metaAndAssetCtxs',dex:'xyz'}).catch(()=>[{universe:[]},[]])]);
 S.perps=m[0].universe.map((u,i)=>u.isDelisted?null:perpObj(u,m[1][i],'',i)).filter(p=>p&&p.px>0);
 S.xyz=x[0].universe.map((u,i)=>u.isDelisted?null:perpObj(u,x[1][i],'xyz',XYZ_IDX>0?100000+XYZ_IDX*10000+i:null)).filter(p=>p&&p.px>0);
 allPerps().forEach(p=>S.mids[p.id]=p.px)}
function tokObj(p,inc){const a=p.attributes,bid=p.relationships?.base_token?.data?.id,bt=(inc||[]).find(i=>i.id===bid)?.attributes||{};
 const sym=(bt.symbol||String(a.name).split(' / ')[0]||'?').trim();
 return{kind:'tok',id:a.address,pool:a.address,sym,name:bt.name||a.name,img:bt.image_url&&!/missing/.test(bt.image_url)?bt.image_url:null,token:(bid||'').replace('solana_',''),px:+a.base_token_price_usd||0,
  ch:+(a.price_change_percentage?.h24||0),chg:a.price_change_percentage||{},vol:+(a.volume_usd?.h24||0),mc:+(a.market_cap_usd||a.fdv_usd||0),liq:+(a.reserve_in_usd||0),tx:a.transactions?.h24||{},created:a.pool_created_at,dex:p.relationships?.dex?.data?.id||''}}
const TOKPATH={trend:'/networks/solana/trending_pools?include=base_token,dex',new:'/networks/solana/new_pools?include=base_token,dex',top:'/networks/solana/pools?include=base_token,dex&sort=h24_volume_usd_desc',grad:'/networks/solana/dexes/pumpswap/pools?include=base_token,dex'};
const TOK_CACHE=['https://studioamr.github.io/northpoint-social/data/tokens.json','data/tokens.json'];let tokCache=null,tokCacheAt=0;
// listas de tokens desde nuestro caché (GitHub Action cada 5 min); si está viejo (>15 min) se piden en vivo a GeckoTerminal
async function tokCached(){if(tokCache&&Date.now()-tokCacheAt<120000)return tokCache;for(const u of TOK_CACHE){try{const r=await fetch(u,{cache:'no-cache'});if(r.ok){const d=await r.json();if(!tokCache||d.updated>=tokCache.updated){tokCache=d;tokCacheAt=Date.now()}return tokCache}}catch(e){}}return tokCache}
async function loadTokens(f){let d=null;const c=await tokCached();if(c&&c.lists&&c.lists[f]&&Date.now()/1000-c.updated<900)d=c.lists[f];if(!d)d=await gt(TOKPATH[f],60000);const L=(d.data||[]).map(p=>tokObj(p,d.included)).filter(t=>t.px>0);S.tokens[f]=L;return L}
async function loadLB(){for(const u of LB_URLS){try{const r=await fetch(u,{cache:'no-cache'});if(r.ok){S.lb=await r.json();return}}catch(e){}}S.lb={rows:[],updated:0}}
const lbRow=a=>S.lb?.rows.find(r=>r.a.toLowerCase()===String(a||'').toLowerCase());
const nameOf=a=>{const r=lbRow(a);return r&&r.n?r.n:shortA(a)};
const dirEs=d=>({'Open Long':'opened long','Close Long':'closed long','Open Short':'opened short','Close Short':'closed short','Buy':'bought','Sell':'sold','Long > Short':'flipped short','Short > Long':'flipped long'}[d]||d||'traded');

// ---------- lista izquierda ----------
const FILTERS={tokens:[['trend','trending'],['new','new'],['top','top volume'],['grad','graduated'],['fav','favorites']],perps:[['vol','volume'],['gain','gainers'],['lose','losers'],['lev','leverage'],['fav','favorites']],
 mercados:[['idx','indices'],['comm','commodities'],['stk','stocks'],['fx','forex']],rank:[['day','24h'],['week','7 days'],['month','30 days'],['allTime','all time']],feed:[['all','following'],['top','top today']]};

 return `<div class="it ${S.cur&&S.cur.id===m.id?'on':''}" data-m="${m.kind}|${esc(m.id)}">${icon(m,30)}<div class="g"><div class="n">${esc(m.sym)}</div><div class="sm m mut">$${px(m.px)}</div></div><div class="r"><div class="sm m">${extra}</div><div class="sm m ${m.ch>=0?'up':'dn'}">${pc(m.ch)}</div></div></div>`}
let listGen=0;
async function renderList(){const g=++listGen,el=$('#list');renderFilt();const f=S.filt[S.tab];
 try{
  if(S.tab==='tokens'){
   if(f==='fav'){const F=S.favs.filter(x=>x.kind==='tok');el.innerHTML=F.length?F.map(mrow).join(''):'<div class="load">tap the star on a token to save it here.</div>';return}
   if(!S.tokens[f])el.innerHTML='<div class="load">loading Solana tokens…</div>';const L=await loadTokens(f);if(g!==listGen)return;el.innerHTML=L.map(mrow).join('')||'<div class="load">no results</div>'}
  else if(S.tab==='perps'){let L=f==='fav'?allPerps().filter(p=>S.favs.some(x=>x.id===p.id)):[...S.perps];
   L.sort(f==='gain'?(a,b)=>b.ch-a.ch:f==='lose'?(a,b)=>a.ch-b.ch:f==='lev'?(a,b)=>b.maxLev-a.maxLev||b.vol-a.vol:(a,b)=>b.vol-a.vol);el.innerHTML=L.map(mrow).join('')||'<div class="load">tap the star on a perp to save it here.</div>'}

const LAY_DEF={sw:272,rw:304,bh:290,pw:380,noside:false,noright:false,focus:false,swap:false};

function applyLay(){const r=document.documentElement.style;r.setProperty('--sw',LAY.sw+'px');r.setProperty('--rw',LAY.rw+'px');r.setProperty('--bh',LAY.bh+'px');r.setProperty('--pw',LAY.pw+'px');
 $('#main').classList.toggle('noside',LAY.noside);$('#main').classList.toggle('noright',LAY.noright);$('.center').classList.toggle('focus',LAY.focus);$('#bottom').classList.toggle('swap',LAY.swap);
 $('#rzS').style.display=LAY.noside?'none':'';$('#rzR').style.display=LAY.noright?'none':'';$('#rzB').style.display=LAY.focus?'none':'';
 $$('[data-lay]').forEach(b=>b.classList.toggle('on',(b.dataset.lay==='side'&&!LAY.noside)||(b.dataset.lay==='right'&&!LAY.noright)||(b.dataset.lay==='focus'&&LAY.focus)));
 store.set('layout',LAY);setTimeout(draw,30)}
function rz(id,key,axis,calc,min,max){const el=$('#'+id);let st=null;
 el.addEventListener('mousedown',e=>{e.preventDefault();st={x:e.clientX,y:e.clientY,v:LAY[key]};el.classList.add('on');document.body.classList.add('resizing');if(axis==='y')document.body.classList.add('rowr')});
 addEventListener('mousemove',e=>{if(!st)return;LAY[key]=Math.round(Math.max(min,Math.min(max(),calc(st,e))));applyLay()});
 addEventListener('mouseup',()=>{if(st){st=null;el.classList.remove('on');document.body.classList.remove('resizing','rowr')}});
 el.addEventListener('dblclick',()=>{LAY[key]=LAY_DEF[key];applyLay()})}
rz('rzS','sw','x',(s,e)=>s.v+(e.clientX-s.x),190,()=>innerWidth*.35);
rz('rzR','rw','x',(s,e)=>s.v-(e.clientX-s.x),250,()=>innerWidth*.4);
rz('rzB','bh','y',(s,e)=>s.v-(e.clientY-s.y),120,()=>innerHeight*.7);
rz('rzP','pw','x',(s,e)=>LAY.swap?s.v+(e.clientX-s.x):s.v-(e.clientX-s.x),260,()=>innerWidth*.5);
function layAction(k){if(k==='side')LAY.noside=!LAY.noside;else if(k==='right')LAY.noright=!LAY.noright;else if(k==='focus')LAY.focus=!LAY.focus;else if(k==='reset')Object.assign(LAY,LAY_DEF);else if(k==='swap')LAY.swap=!LAY.swap;applyLay()}

 const mints=Object.keys(b).filter(k=>k!=='SOL'&&+b[k].uiAmount>0).slice(0,49);if(mints.length){try{const p2=await fetch(JUP+'/price/v3?ids='+mints.join(',')).then(r=>r.json());RS.solTokPx=p2}catch(e){}}

const solHave=mint=>{const b=RS.solBal?.[mint];return b?{amt:BigInt(b.amount),ui:+b.uiAmount,dec:b.uiAmount?Math.round(Math.log10(+b.amount/+b.uiAmount)):0}:null};
async function solSwap(){const m=S.cur,v=parseFloat($('#amt').value);if(!m||m.kind!=='tok'||!(v>0)||RS.busy)return;
 if(!RS.sol){try{await solConnect();ticket()}catch(e){toast('<span class="dn">'+esc(e.message)+'</span>')}return}

 RS.busy=true;const g=$('#go');g.disabled=true;g.textContent='getting best route…';
 try{let qs=`inputMint=${inMint}&outputMint=${outMint}&amount=${amount}&slippageBps=${REAL.solSlippageBps}`;if(REAL.solFeeBps&&REAL.solFeeAccount)qs+=`&platformFeeBps=${REAL.solFeeBps}`;

  const imp=+q.priceImpactPct*100;if(imp>5&&!confirm(`price impact is ${imp.toFixed(1)}%. you could get much less than expected. continue?`))throw new Error('canceled');
  const body={quoteResponse:q,userPublicKey:RS.sol,wrapAndUnwrapSol:true,dynamicComputeUnitLimit:true,prioritizationFeeLamports:'auto'};if(REAL.solFeeBps&&REAL.solFeeAccount)body.feeAccount=REAL.solFeeAccount;
  const sw=await fetch(JUP+'/swap/v1/swap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());if(!sw.swapTransaction)throw new Error(sw.error||'could not build the transaction');
  if(sw.simulationError)throw new Error('simulation failed: '+(sw.simulationError.error||JSON.stringify(sw.simulationError)));
  const W3=await solLib(),tx=W3.VersionedTransaction.deserialize(Uint8Array.from(atob(sw.swapTransaction),c=>c.charCodeAt(0)));
  g.textContent='confirm in your wallet…';const r=await solProv().signAndSendTransaction(tx);const sig=r.signature||r;

  $('#amt').value='';setTimeout(refreshSol,4000);setTimeout(refreshSol,12000)}
 catch(e){if(e.message!=='canceled')toast('<span class="dn">swap failed:</span> '+esc(e.message||e))}
 finally{RS.busy=false;ticket()}}

 else if(last&&last.kind==='perp'&&allPerps().some(x=>x.id===last.id))select(allPerps().find(x=>x.id===last.id));
 else if(last&&last.kind==='tok')openM('tok',last.id);
 else{const L=await loadTokens('trend').catch(()=>[]);if(L[0])select(L[0]);else{const b=S.perps.find(p=>p.id==='BTC');if(b)select(b)}}
 setInterval(()=>{if(S.cur&&S.cur.kind==='tok'&&!document.hidden)loadTokTrades(selGen,false)},20000);
 setInterval(async()=>{if(!S.cur||S.cur.kind!=='tok'||document.hidden)return;const m=S.cur;try{const d=await gt(`/networks/solana/pools/${m.pool}?include=base_token,dex`,30000);const n=tokObj(d.data,d.included);if(S.cur!==m)return;Object.assign(m,{px:n.px,ch:n.ch,chg:n.chg,vol:n.vol,mc:n.mc,liq:n.liq,tx:n.tx});head();about();ticket(true);renderPos(true);wallet()}catch(e){}loadCandles(selGen)},45000);
 setInterval(async()=>{if(document.hidden)return;try{await loadPerps();if(S.cur&&S.cur.kind==='perp'){const n=allPerps().find(x=>x.id===S.cur.id);if(n){Object.assign(S.cur,{prev:n.prev,ch:n.ch,vol:n.vol,oi:n.oi,fund:n.fund});head()}}if(S.tab==='perps'||S.tab==='mercados')renderList()}catch(e){}},60000);
 setInterval(()=>{if(S.cur&&S.cur.kind==='perp'&&!document.hidden)loadTopPositions(selGen)},90000);
 setInterval(()=>{if(S.cur&&S.cur.kind==='perp')about()},5000);
 setInterval(pollAlerts,45000);setTimeout(pollAlerts,5000);
 setInterval(()=>{if(RS.on&&!document.hidden)refreshReal()},5000);
 setInterval(()=>{if(RS.on&&RS.sol&&!document.hidden)refreshSol()},20000);
 if(store.get('mode','paper')==='real'&&((RS.addr&&store.get(agentKeyName(RS.addr),null))||RS.sol)){loadAgent().catch(()=>{}).then(()=>setMode('real',true))}
 setInterval(()=>{if(S.tab==='feed'&&!document.hidden)renderList()},60000);
})();

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
